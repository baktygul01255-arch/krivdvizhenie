<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}[hidden]{display:none!important}</style>
<title>Движение по окружности 9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=PT+Sans:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: lab-notebook screens, one idea per screen; cold blue (solid) → hot orange (liquid) as the subject's own color logic */
/* Layout: one idea per screen; orange = velocity v (tangent), magenta = acceleration a (to the centre) — the subject's own vector colours */
:root{
  --bg:#F4F4FA; --grid:rgba(79,70,200,.07); --surface:#FFFFFF; --surface2:#ECEBF7;
  --ink:#1A1A33; --muted:#5A5A78; --line:#D8D7EA;
  --accent:#4F46C8; --accent-ink:#FFFFFF;
  --vel:#D9620B; --acc:#B0359E; --cold:#4F46C8; --hot:#D9620B; --warm:#E89A2C;
  --ok:#1E8C4E; --ok-bg:#E2F4E9; --bad:#C23A3A; --bad-bg:#FBE7E7;
  --glass:#C9C7E6; --flame:#E89A2C;
  --f-display:"Rubik","Segoe UI",system-ui,sans-serif;
  --f-body:"PT Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11111F; --grid:rgba(150,140,255,.07); --surface:#1A1A2E; --surface2:#23233D;
  --ink:#E6E5F5; --muted:#A09FC0; --line:#33335A;
  --accent:#8F88FF; --accent-ink:#0E0D1F;
  --vel:#FF9A4D; --acc:#F07BDC; --cold:#8F88FF; --hot:#FF9A4D; --warm:#FFC060;
  --ok:#5BD08B; --ok-bg:#15301F; --bad:#FF7A7A; --bad-bg:#3A1A1E;
  --glass:#3F3F66; --flame:#FFC060;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11111F; --grid:rgba(150,140,255,.07); --surface:#1A1A2E; --surface2:#23233D;
  --ink:#E6E5F5; --muted:#A09FC0; --line:#33335A;
  --accent:#8F88FF; --accent-ink:#0E0D1F;
  --vel:#FF9A4D; --acc:#F07BDC; --cold:#8F88FF; --hot:#FF9A4D; --warm:#FFC060;
  --ok:#5BD08B; --ok-bg:#15301F; --bad:#FF7A7A; --bad-bg:#3A1A1E;
  --glass:#3F3F66; --flame:#FFC060;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:clamp(18px,1.1vw + 9px,28px);line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
sup{font-size:.65em}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{padding:10px clamp(16px,3vw,64px);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.badge{font-family:var(--f-mono);font-size:clamp(13px,.6vw + 8px,20px);font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:.3em .6em;white-space:nowrap}
.brand b{font-family:var(--f-display);font-weight:700;font-size:clamp(16px,.9vw + 8px,26px)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:none;border-radius:999px;padding:.35em .9em;font-weight:700;font-size:clamp(14px,.7vw + 8px,22px);cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.iconbtn{width:clamp(38px,2.6vw + 10px,56px);height:clamp(38px,2.6vw + 10px,56px);border-radius:50%;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.iconbtn svg{width:55%;height:55%;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}

.wrap{padding-inline:clamp(16px,3vw,64px);padding-block:0 120px}
.screen{min-height:calc(100dvh - clamp(150px,10vw + 60px,240px));display:grid;align-content:center;padding-block:28px;animation:rise .45s ease both}
.screen > *{min-width:0}
@keyframes rise{from{opacity:.15;transform:translateY(16px)}to{opacity:1;transform:none}}
.eyebrow{font-family:var(--f-mono);font-size:clamp(13px,.7vw + 8px,22px);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}

.cover{min-height:calc(100dvh - 70px)}
.coverin{display:grid;gap:clamp(18px,2vw,40px)}
.cover h1{font-size:clamp(36px,4.6vw + 14px,104px);font-weight:800;letter-spacing:-.015em}
.cover h1 .c{color:var(--cold)} .cover h1 .h{color:var(--hot)}
.lead{font-size:clamp(18px,1.4vw + 8px,34px);color:var(--muted);max-width:52ch}
.plan{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.plan li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:clamp(12px,1.2vw,24px);font-family:var(--f-display);font-weight:700;font-size:clamp(17px,1.1vw + 8px,30px);display:flex;gap:10px;align-items:center}
.plan .n{font-family:var(--f-mono);width:1.6em;height:1.6em;border-radius:50%;background:var(--surface2);color:var(--accent);display:grid;place-items:center;font-size:.8em;flex:none}
.foot{color:var(--muted);font-size:clamp(14px,.6vw + 8px,20px)}

.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(20px,3vw,40px);display:grid;gap:clamp(14px,1.4vw,28px);align-content:start;min-width:0;font-size:clamp(19px,1.35vw + 8px,34px);line-height:1.45}
.block h2{font-size:clamp(26px,2.6vw + 10px,62px);font-weight:700}
.def{border-left:4px solid var(--accent);padding-left:.6em}
.def.cold{border-color:var(--cold)} .def.hot{border-color:var(--hot)}
.ex{color:var(--muted);font-style:italic}
.aside{background:var(--surface2);border-radius:12px;padding:clamp(8px,1vw,18px);overflow-x:auto;min-width:0}
.aside svg{display:block;width:100%;height:auto;max-height:58vh;min-width:280px}
.aside svg text{font-family:var(--f-body);fill:var(--ink)}
.formula{font-family:var(--f-mono);font-size:clamp(30px,3.4vw + 10px,84px);font-weight:700;text-align:center;padding:.4em;border-radius:12px;background:var(--surface2)}
.formula small{display:block;font-size:.4em;font-weight:500;color:var(--muted);margin-top:.3em}
@media (min-width:1000px){
  .block.split{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);column-gap:clamp(24px,3vw,72px);align-items:center}
  .block.split > *{grid-column:1}
  .block.split > .aside{grid-column:2;grid-row:1 / span 9}
}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:.35em .6em;border-bottom:1px solid var(--line);text-align:left}
th{font-family:var(--f-display);font-size:.78em;color:var(--muted);font-weight:700}
td.n{font-family:var(--f-mono);text-align:right} th.n{text-align:right}
.ref td,.ref th{font-size:.85em}

.btn{border:0;border-radius:10px;padding:.55em 1.1em;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer;font-family:var(--f-display);font-size:clamp(16px,.9vw + 8px,26px)}
.btn.big{font-size:clamp(19px,1.2vw + 10px,34px);border-radius:12px}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.heat{background:var(--hot);color:#fff} .btn.cool{background:var(--cold);color:#fff}
.btn[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--ink)}
.btn:disabled{opacity:.4;cursor:default}

/* lab */
.lab{display:grid;gap:clamp(14px,1.4vw,24px)}
.labhead{display:grid;gap:6px}
.labhead p{color:var(--muted)}
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:14px}
@media (max-width:760px){.stage{grid-template-columns:1fr}}
.cv{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface2)}
canvas{display:block;width:100%;height:clamp(240px,38vh,520px)}
.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.ro{background:var(--surface2);border-radius:10px;padding:.5em .7em;display:grid;gap:2px}
.ro span{font-size:.62em;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.ro b{font-family:var(--f-mono);font-size:1em;font-variant-numeric:tabular-nums}
.state{display:inline-block;border-radius:999px;padding:.05em .6em;font-family:var(--f-display);font-size:.85em}
.st-solid{background:var(--cold);color:#fff}.st-liquid{background:var(--hot);color:#fff}.st-mid{background:var(--warm);color:#1b1b1b}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px;align-items:end}
.ctl{display:grid;gap:4px;min-width:0}
.ctl label{font-weight:700;font-size:.8em;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ctl output{font-family:var(--f-mono);color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);height:clamp(20px,1.5vw,36px)}
input[type=number],select{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:.3em .5em;font-family:var(--f-mono);font-size:clamp(17px,1vw + 8px,28px);min-width:0}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.note{color:var(--muted);font-size:.7em}

/* calc */
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:18px}
.field{display:grid;gap:4px}
.field label{font-weight:700;font-size:.8em}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row input{flex:1 1 120px}
.solution{font-family:var(--f-mono);font-size:.82em;background:var(--surface2);border-radius:10px;padding:.8em;display:grid;gap:.4em;overflow-wrap:anywhere}
.solution .ans{font-weight:700;color:var(--accent);font-size:1.1em}
.err{color:var(--bad)}

/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.progress{flex:1 1 200px;height:clamp(8px,.6vw,14px);background:var(--surface2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qnum{font-family:var(--f-mono);font-weight:700;color:var(--muted);font-size:.75em}
.qtext{font-size:clamp(22px,1.9vw + 8px,48px);font-family:var(--f-display);font-weight:500;line-height:1.3}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:.55em .8em;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-weight:700;color:var(--accent);flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-bg)} .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.feedback{border-radius:10px;padding:.6em .8em}
.feedback.good{background:var(--ok-bg)} .feedback.bad{background:var(--bad-bg)}
.feedback b{display:block}
.score{font-size:clamp(46px,6vw,140px);font-family:var(--f-display);font-weight:800;color:var(--accent)}

.stepper{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.stepin{padding:10px clamp(16px,3vw,64px);display:flex;align-items:center;gap:12px}
.where{flex:1;display:grid;justify-items:center;gap:6px;min-width:0}
#secName{font-family:var(--f-display);font-weight:700;font-size:clamp(14px,.8vw + 8px,24px);color:var(--muted);text-align:center}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dots button{width:clamp(10px,.7vw,16px);height:clamp(10px,.7vw,16px);border-radius:50%;border:0;padding:0;background:var(--line);cursor:pointer}
.dots button[aria-current="step"]{background:var(--accent);width:clamp(26px,2vw,44px);border-radius:99px}
@media (max-width:480px){.stepin .btn{padding:.5em .7em;font-size:14px}}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}


/* grade 9 lab */
.stage9{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:820px){.stage9{grid-template-columns:1fr}}
#disk{height:clamp(300px,54vh,640px)}
.readouts.col{grid-template-columns:1fr}
.v-c{color:var(--vel)!important}.a-c{color:var(--acc)!important}
.cover h1 .h{color:var(--vel)}

/* problem question + functional literacy */
.prob{display:grid;gap:clamp(14px,1.6vw,30px)}
.prob .tag{display:inline-flex;align-items:center;gap:.4em;font-family:var(--f-mono);font-weight:700;font-size:clamp(13px,.7vw + 8px,22px);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.prob .bigq{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,2.8vw + 10px,64px);line-height:1.2;text-wrap:balance}
.prob .sit{color:var(--muted)}
.hyps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:10px}
.hyp{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:.6em .8em;cursor:pointer;display:flex;gap:.6em;align-items:flex-start;font-size:inherit}
.hyp .k{font-family:var(--f-mono);font-weight:700;color:var(--accent);flex:none}
.hyp[aria-pressed="true"]{border-color:var(--accent);background:var(--surface2)}
.reveal{border-radius:12px;padding:.8em 1em;background:var(--ok-bg);border-left:5px solid var(--ok)}
.muted{color:var(--muted)}
.fg{display:grid;gap:clamp(14px,1.6vw,28px)}
.ctx{background:var(--surface2);border-radius:12px;padding:clamp(12px,1.4vw,26px);display:grid;gap:.6em}
.ctx table{font-size:.9em}
.tasks{display:grid;gap:clamp(12px,1.4vw,24px)}
.task{border:1.5px solid var(--line);border-radius:12px;padding:clamp(12px,1.4vw,24px);display:grid;gap:.6em}
.task .tn{font-family:var(--f-mono);font-weight:700;color:var(--accent);font-size:.75em;text-transform:uppercase;letter-spacing:.06em}
.task .tq{font-weight:700}
.ansrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ansrow input{width:min(100%,220px);border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:.3em .5em;font-family:var(--f-mono);font-size:inherit}
.ansrow .unit{font-family:var(--f-mono);font-weight:700}
.task textarea{width:100%;min-height:4.5em;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:.5em;font:inherit;color:inherit;resize:vertical}
.fb{border-radius:10px;padding:.5em .8em}
.fb.good{background:var(--ok-bg)} .fb.bad{background:var(--bad-bg)}
.fb.info{background:var(--surface2)}
.task .opt{font-size:inherit}
</style>
</head>
<body>


<header>
  <div class="bar">
    <div class="brand"><span class="badge">9 · ФИЗ</span><b data-i18n="brand"></b></div>
    <div class="seg" role="group" aria-label="Язык / Тіл">
      <button id="lang-ru" aria-pressed="true">РУС</button>
      <button id="lang-kz" aria-pressed="false">ҚАЗ</button>
    </div>
    <button class="iconbtn" id="themeBtn" aria-label="Тема"></button>
  </div>
</header>

<div class="wrap">
<main>
  <section class="screen cover" data-step data-sec="cover">
    <div class="coverin">
      <span class="eyebrow" data-i18n="eyebrow"></span>
      <h1 id="coverTitle"></h1>
      <p class="lead" data-i18n="lead"></p>
      <ol class="plan">
        <li><span class="n">1</span><span data-i18n="sec0"></span></li>
        <li><span class="n">2</span><span data-i18n="sec1"></span></li>
        <li><span class="n">3</span><span data-i18n="sec2"></span></li>
        <li><span class="n">4</span><span data-i18n="sec3"></span></li>
        <li><span class="n">5</span><span data-i18n="secFG"></span></li>
        <li><span class="n">6</span><span data-i18n="sec4"></span></li>
      </ol>
      <div><button class="btn big" id="startBtn" data-i18n="start"></button></div>
      <p class="foot" data-i18n="foot"></p>
    </div>
  </section>

  <section class="screen" id="p-prob" data-step data-sec="sec0" hidden>
    <article class="block prob" id="probBox"></article>
  </section>


  <!-- 1 curvilinear -->
  <section class="screen" data-step data-sec="sec1" hidden>
    <article class="block split">
      <span class="eyebrow" data-i18n="sec1"></span>
      <h2 data-i18n="s1h"></h2>
      <p class="def" data-i18n="s1a"></p>
      <p data-i18n="s1b"></p>
      <p data-i18n="s1c"></p>
      <p class="ex" data-i18n="s1ex"></p>
      <div class="aside">
        <svg viewBox="0 0 440 240" role="img">
          <path d="M20 190 C 80 40, 160 40, 210 120 S 340 230, 420 70" fill="none" style="stroke:var(--accent)" stroke-width="4"/>
          <circle cx="83" cy="95" r="7" style="fill:var(--ink)"/>
          <line x1="83" y1="95" x2="125" y2="45" style="stroke:var(--vel)" stroke-width="4"/>
          <polygon points="131,38 113,46 125,56" style="fill:var(--vel)"/>
          <circle cx="210" cy="120" r="7" style="fill:var(--ink)"/>
          <line x1="210" y1="120" x2="252" y2="168" style="stroke:var(--vel)" stroke-width="4"/>
          <polygon points="258,175 240,170 252,159" style="fill:var(--vel)"/>
          <circle cx="360" cy="170" r="7" style="fill:var(--ink)"/>
          <line x1="360" y1="170" x2="408" y2="140" style="stroke:var(--vel)" stroke-width="4"/>
          <polygon points="416,135 398,136 405,149" style="fill:var(--vel)"/>
          <g style="fill:var(--vel);font-weight:700;font-size:18px;font-style:italic"><text x="132" y="62">v</text><text x="262" y="160">v</text><text x="404" y="128">v</text></g>
          <circle cx="83" cy="150" r="58" fill="none" style="stroke:var(--muted)" stroke-width="1.5" stroke-dasharray="5 5"/>
          <text x="20" y="232" style="font-size:15px" data-i18n="svgTraj"></text>
        </svg>
      </div>
    </article>
  </section>

  <!-- 2 uniform circular, T, nu -->
  <section class="screen" data-step data-sec="sec1" hidden>
    <article class="block split">
      <span class="eyebrow" data-i18n="sec1"></span>
      <h2 data-i18n="s2h"></h2>
      <p class="def" data-i18n="s2a"></p>
      <p data-i18n-html="s2b"></p>
      <p data-i18n-html="s2c"></p>
      <p class="ex" data-i18n="s2ex"></p>
      <div class="aside">
        <div class="formula">T = t / N<small>ν = N / t = 1 / T</small></div>
        <svg viewBox="0 0 440 210" role="img" style="margin-top:10px">
          <circle cx="110" cy="105" r="80" fill="none" style="stroke:var(--line)" stroke-width="10"/>
          <path d="M110 25 A80 80 0 1 1 30 105" fill="none" style="stroke:var(--accent)" stroke-width="10" stroke-linecap="round"/>
          <circle cx="110" cy="105" r="5" style="fill:var(--ink)"/>
                    <text x="230" y="70" style="font-size:17px;font-weight:700" data-i18n="svgOneTurn"></text>
          <text x="230" y="100" style="font-size:16px" data-i18n="svgTdef"></text>
          <text x="230" y="140" style="font-size:16px" data-i18n="svgNudef"></text>
        </svg>
      </div>
    </article>
  </section>

  <!-- 3 linear speed -->
  <section class="screen" data-step data-sec="sec1" hidden>
    <article class="block split">
      <span class="eyebrow" data-i18n="sec1"></span>
      <h2 data-i18n="s3h"></h2>

/* steps */
const screens=[...document.querySelectorAll("[data-step]")];
let cur=0;
function updateStepper(){
  const l=L(), n=screens.length-1;
  $("prevBtn").textContent=l.back; $("nextBtn").textContent=l.fwd;
  $("prevBtn").disabled=cur<=1; $("nextBtn").disabled=cur>=n;
  $("secName").textContent = cur>0 ? `${l[screens[cur].dataset.sec]} · ${l.stepOf} ${cur}/${n}` : "";
  const d=$("dots");
  if(d.children.length!==n){ d.innerHTML=""; for(let i=1;i<=n;i++){const b=document.createElement("button"); b.setAttribute("aria-label",String(i)); b.onclick=()=>showStep(i); d.appendChild(b);} }
  [...d.children].forEach((b,i)=> i+1===cur ? b.setAttribute("aria-current","step") : b.removeAttribute("aria-current"));
}
function showStep(i){
  cur=Math.max(0,Math.min(screens.length-1,i));
  screens.forEach((s,k)=>{s.hidden=k!==cur;});
  $("stepper").hidden = cur===0;
  if(screens[cur].id==="p-sim") resize();
  updateStepper(); window.scrollTo({top:0});
}
$("startBtn").onclick=()=>showStep(1);
$("prevBtn").onclick=()=>showStep(cur-1);
$("nextBtn").onclick=()=>showStep(cur+1);
document.addEventListener("keydown",e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if(e.key==="ArrowRight"&&cur>0) showStep(cur+1);
  if(e.key==="ArrowLeft"&&cur>1) showStep(cur-1);
});

/* simulation: point on a rotating disk */
const cv=$("disk"), ctx=cv.getContext("2d");
let C={}, W=400; const VH=400;
function readColors(){const s=getComputedStyle(document.documentElement); ["ink","muted","line","surface","surface2","accent","vel","acc"].forEach(k=>C[k]=s.getPropertyValue("--"+k).trim());}
function resize(){const r=cv.getBoundingClientRect(); if(!r.width) return; const dpr=window.devicePixelRatio||1, sc=r.height/VH; cv.width=r.width*dpr; cv.height=r.height*dpr; ctx.setTransform(dpr*sc,0,0,dpr*sc,0,0); W=r.width/sc;}
window.addEventListener("resize",resize);
const RMAX=2;
let ang=0, running=true, released=null, trail=[];
function R(){return +$("rR").value;} function Tp(){return +$("rT").value;}
function pxPerM(){return (Math.min(W,VH)/2-40)/RMAX;}
function updatePlay(){$("bPlay").textContent=running?L().play:L().resume;}
$("bPlay").onclick=()=>{running=!running; updatePlay();};
$("bRelease").onclick=()=>{ if(released) return; const k=pxPerM(), r=R()*k, w=2*Math.PI/Tp();
  const x=W/2+r*Math.cos(ang), y=VH/2-r*Math.sin(ang);
  released={x,y,vx:-r*w*Math.sin(ang),vy:-r*w*Math.cos(ang),x0:x,y0:y}; };
$("bBack").onclick=()=>{released=null;};
$("rR").oninput=()=>{updateReadouts();}; $("rT").oninput=()=>{updateReadouts();};
function updateReadouts(){
  const l=L(), r=R(), t=Tp(), w=2*Math.PI/t, v=w*r, a=v*v/r;
  $("rOut").textContent=fmt(r,1)+" "+l.u.m; $("tOut").textContent=fmt(t,1)+" "+l.u.s;
  $("roT").textContent=fmt(t,2)+" "+l.u.s; $("roNu").textContent=fmt(1/t,2)+" Гц";
  $("roW").textContent=fmt(w,2)+" рад/с"; $("roV").textContent=fmt(v,2)+" "+l.u.ms; $("roA").textContent=fmt(a,2)+" м/с²";
  $("roIn").textContent=fmt(v/2,2)+" "+l.u.ms+" · "+fmt(a/2,2)+" м/с²";
}
function arrow(x,y,dx,dy,col,label){
  const len=Math.hypot(dx,dy); if(len<1) return; const ux=dx/len, uy=dy/len;
  ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=4; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+dx-ux*10,y+dy-uy*10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+dx,y+dy); ctx.lineTo(x+dx-ux*14-uy*7,y+dy-uy*14+ux*7); ctx.lineTo(x+dx-ux*14+uy*7,y+dy-uy*14-ux*7); ctx.fill();
  if(label){ctx.font="italic 700 20px 'PT Sans', sans-serif"; ctx.fillText(label,x+dx+ux*8-6,y+dy+uy*8+6);}
}
function draw(){
  const cx=W/2, cy=VH/2, k=pxPerM(), r=R()*k, rMax=RMAX*k;
  ctx.clearRect(0,0,W,VH); ctx.fillStyle=C.surface2; ctx.fillRect(0,0,W,VH);
  // disk
  ctx.fillStyle=C.surface; ctx.beginPath(); ctx.arc(cx,cy,rMax+12,0,7); ctx.fill();
  ctx.strokeStyle=C.line; ctx.lineWidth=2; ctx.stroke();
  // spokes rotating with disk
  ctx.strokeStyle=C.line; ctx.lineWidth=1.5;
  for(let i=0;i<8;i++){const a=ang+i*Math.PI/4; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+(rMax+12)*Math.cos(a),cy-(rMax+12)*Math.sin(a)); ctx.stroke();}
  // orbit circles
  ctx.setLineDash([6,6]); ctx.strokeStyle=C.muted; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.stroke(); ctx.beginPath(); ctx.arc(cx,cy,r/2,0,7); ctx.stroke(); ctx.setLineDash([]);
  // center
  ctx.fillStyle=C.ink; ctx.beginPath(); ctx.arc(cx,cy,5,0,7); ctx.fill();
  const w=2*Math.PI/Tp(), v=w*R(), a=v*v/R();
  const lenV=Math.min(130,18+v*6), lenA=Math.min(r-12,14+Math.sqrt(a)*9);
  // inner point
  const ix=cx+r/2*Math.cos(ang), iy=cy-r/2*Math.sin(ang);

  arrow(ix,iy,-Math.sin(ang)*lenV/2,-Math.cos(ang)*lenV/2,C.vel,"");
  // outer point
  if(!released){
    const px=cx+r*Math.cos(ang), py=cy-r*Math.sin(ang);
    ctx.strokeStyle=C.ink; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(px,py); ctx.stroke();
    ctx.font="italic 700 18px 'PT Sans', sans-serif"; ctx.fillStyle=C.ink; ctx.fillText("R",(cx+px)/2+8,(cy+py)/2-8);

    arrow(px,py,-Math.cos(ang)*lenA,Math.sin(ang)*lenA,C.acc,"a");
    ctx.fillStyle=C.ink; ctx.beginPath(); ctx.arc(px,py,11,0,7); ctx.fill();
  } else {
    // straight tangent path
    ctx.setLineDash([4,6]); ctx.strokeStyle=C.vel; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(released.x0,released.y0); ctx.lineTo(released.x,released.y); ctx.stroke(); ctx.setLineDash([]);
    const sp=Math.hypot(released.vx,released.vy)||1;
    arrow(released.x,released.y,released.vx/sp*lenV,released.vy/sp*lenV,C.vel,"v");
    ctx.fillStyle=C.ink; ctx.beginPath(); ctx.arc(released.x,released.y,11,0,7); ctx.fill();

}
let last=null;
function loop(ts){
  if(last===null) last=ts; const dt=Math.min(.05,(ts-last)/1000); last=ts;
  if(running){ ang+=2*Math.PI/Tp()*dt; if(ang>2*Math.PI) ang-=2*Math.PI;
    if(released){ const ins=released.x>-40&&released.x<W+40&&released.y>-40&&released.y<VH+40; if(ins){released.x+=released.vx*dt; released.y+=released.vy*dt;} } }
  if(!$("p-sim").hidden) draw();
  requestAnimationFrame(loop);
}

/* calculator */
function calc(){
  const l=L(), u=l.u, md=$("cMode").value, out=$("solution");
  $("fR").hidden=false; $("fT").hidden=md!=="RT"; $("fNu").hidden=md!=="Rnu"; $("fN").hidden=md!=="RNt"; $("ft").hidden=md!=="RNt"; $("fV").hidden=md!=="vR";
  const rv=+$("cR").value, ru=+$("cRu").value, r=rv*ru, rName=$("cRu").selectedOptions[0].textContent;
  const err=()=>{out.innerHTML=`<span class="err">${l.errIn}</span>`;};
  if(!(rv>0)) return err();
  let Tt, given=[`R = ${fmt(rv,4)} ${rName}${ru!==1?` = ${fmt(r,4)} ${u.m}`:""}`], lines=[];
  if(md==="RT"){ Tt=+$("cT").value; if(!(Tt>0)) return err(); given.push(`T = ${fmt(Tt,4)} ${u.s}`); lines.push(`ν = 1 / T = 1 / ${fmt(Tt,4)} = ${fmt(1/Tt,3)} Гц`); }
  else if(md==="Rnu"){ const nu=+$("cNu").value; if(!(nu>0)) return err(); Tt=1/nu; given.push(`ν = ${fmt(nu,4)} Гц`); lines.push(`T = 1 / ν = 1 / ${fmt(nu,4)} = ${fmt(Tt,4)} ${u.s}`); }
  else if(md==="RNt"){ const N=+$("cN").value, tv=+$("ct").value, tu=+$("ctu").value, t=tv*tu, tName=$("ctu").selectedOptions[0].textContent; if(!(N>0)||!(tv>0)) return err();
    Tt=t/N; given.push(`N = ${fmt(N,4)}`, `t = ${fmt(tv,4)} ${tName}${tu!==1?` = ${fmt(t,4)} ${u.s}`:""}`);
    lines.push(`T = t / N = ${fmt(t,4)} / ${fmt(N,4)} = ${fmt(Tt,4)} ${u.s}`, `ν = N / t = ${fmt(N,4)} / ${fmt(t,4)} = ${fmt(1/Tt,3)} Гц`); }
  else { const vv=+$("cV").value, vu=+$("cVu").value, v=vv*(vu===1?1:1/3.6), vName=$("cVu").selectedOptions[0].textContent; if(!(vv>0)) return err();
    given.push(`v = ${fmt(vv,4)} ${vName}${vu!==1?` = ${fmt(v,4)} ${u.ms}`:""}`);
    const w=v/r; Tt=2*Math.PI/w;
    lines.push(`ω = v / R = ${fmt(v,4)} / ${fmt(r,4)} = ${fmt(w,3)} рад/с`, `T = 2πR / v = 2π · ${fmt(r,4)} / ${fmt(v,4)} = ${fmt(Tt,3)} ${u.s}`, `ν = 1 / T = ${fmt(1/Tt,3)} Гц`, `a = v² / R = ${fmt(v,4)}² / ${fmt(r,4)} = ${fmt(v*v/r,3)} м/с²`);
    out.innerHTML=`<div><b>${l.given}</b> ${given.join("; ")}</div><div><b>${l.sol}</b></div>${lines.map(x=>`<div>${x}</div>`).join("")}<div class="ans">${l.ans} ω = ${fmt(w,3)} рад/с; T = ${fmt(Tt,3)} ${u.s}; ν = ${fmt(1/Tt,3)} Гц; a = ${fmt(v*v/r,3)} м/с²</div>`;
    return; }
  const w=2*Math.PI/Tt, v=w*r, a=v*v/r;
  lines.push(`ω = 2π / T = 2π / ${fmt(Tt,4)} = ${fmt(w,3)} рад/с`, `v = ωR = ${fmt(w,3)} · ${fmt(r,4)} = ${fmt(v,3)} ${u.ms}`, `a = v² / R = ${fmt(v,3)}² / ${fmt(r,4)} = ${fmt(a,3)} м/с²`);
  out.innerHTML=`<div><b>${l.given}</b> ${given.join("; ")}</div><div><b>${l.sol}</b></div>${lines.map(x=>`<div>${x}</div>`).join("")}<div class="ans">${l.ans} T = ${fmt(Tt,3)} ${u.s}; ν = ${fmt(1/Tt,3)} Гц; ω = ${fmt(w,3)} рад/с; v = ${fmt(v,3)} ${u.ms}; a = ${fmt(a,3)} м/с²</div>`;
}

let qi=0, score=0, answered=null;
function renderQuiz(){
  const l=L(), box=$("quizBox");
  if(qi>=Q.length){
    box.innerHTML=`<span class="eyebrow">${l.sec4}</span><h2>${l.res}</h2><div class="score">${score} ${l.of} ${Q.length}</div><p>${l.grade(score,Q.length)}</p><div><button class="btn" id="qAgain">${l.again}</button></div>`;
    $("qAgain").onclick=()=>{qi=0;score=0;answered=null;renderQuiz();};
    return;
  }
  const q=Q[qi], [text,opts,expl]=q[lang];
  let h=`<span class="eyebrow">${l.sec4}</span><div class="qtop"><span class="qnum">${l.qOf} ${qi+1} / ${Q.length}</span><div class="progress"><i style="width:${(qi/Q.length)*100}%"></i></div></div><p class="qtext">${text}</p><div class="opts">`;
  opts.forEach((o,i)=>{let cls=""; if(answered!==null){ if(i===q.a) cls="right"; else if(i===answered) cls="wrong"; }
    h+=`<button class="opt ${cls}" data-i="${i}" ${answered!==null?"disabled":""}><span class="k">${"АБВГ"[i]}</span><span>${o}</span></button>`;});
  h+="</div>";
  if(answered!==null){const ok=answered===q.a; h+=`<div class="feedback ${ok?"good":"bad"}"><b>${ok?l.right:l.wrong}</b>${expl}</div><div><button class="btn" id="qNext">${qi===Q.length-1?l.finish:l.next}</button></div>`;}
  box.innerHTML=h;
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{answered=+b.dataset.i; if(answered===q.a) score++; renderQuiz(); $("qNext").focus();});
  if(answered!==null) $("qNext").onclick=()=>{qi++; answered=null; renderQuiz();};
}

   <p class="sit">${p.sit}</p>

   <div class="hyps">${p.opts.map((o,i)=>`<button class="hyp" data-i="${i}" aria-pressed="${probPick===i}"><span class="k">${"АБВГ"[i]}</span><span>${o}</span></button>`).join("")}</div>
   ${probOpen?`<div class="reveal">${p.answer}</div>`:`<p class="muted">${l.hideNote}</p>`}
   <div><button class="btn ${probOpen?"ghost":""}" id="probBtn">${probOpen?l.hideAns:l.showAns}</button></div>`;
  box.querySelectorAll(".hyp").forEach(b=>b.onclick=()=>{probPick=+b.dataset.i; renderProb();});
  $("probBtn").onclick=()=>{probOpen=!probOpen; renderProb();};
}
const fgState={};
function renderFG(){
  const l=L(), f=FG[lang], box=$("fgBox");
  let h=`<span class="eyebrow">${l.fgTag}</span><h2>${f.title}</h2>
   <div class="ctx">${f.context.map(p=>`<p>${p}</p>`).join("")}
   <div style="overflow-x:auto"><table><thead><tr>${f.head.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${f.rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>
   <div class="tasks">`;
  f.tasks.forEach((t,i)=>{
    const st=fgState[i]||(fgState[i]={});
    h+=`<div class="task"><span class="tn">${l.task} ${i+1}</span><p class="tq">${t.q}</p>`;
    if(t.type==="num"){
      h+=`<div class="ansrow"><input type="number" step="any" id="fgIn${i}" value="${st.val??""}" aria-label="${l.task} ${i+1}"><span class="unit">${t.unit}</span><button class="btn" data-check="${i}">${l.check}</button><button class="btn ghost" data-sol="${i}">${l.showSol}</button></div>`;
      if(st.res==="good") h+=`<div class="fb good"><b>${l.correct}</b> ${t.sol}</div>`;
      else if(st.res==="bad") h+=`<div class="fb bad">${l.incorrect}</div>`;
      if(st.sol && st.res!=="good") h+=`<div class="fb info"><b>${l.solLbl}</b> ${t.sol}</div>`;
    } else if(t.type==="choice"){
      h+=`<div class="opts">${t.opts.map((o,j)=>{let c=""; if(st.pick!=null){ if(j===t.a) c="right"; else if(j===st.pick) c="wrong";} return `<button class="opt ${c}" data-task="${i}" data-j="${j}" ${st.pick!=null?"disabled":""}><span class="k">${"АБВГ"[j]}</span><span>${o}</span></button>`;}).join("")}</div>`;
      if(st.pick!=null) h+=`<div class="fb ${st.pick===t.a?"good":"bad"}"><b>${st.pick===t.a?l.correct:l.incorrect.split(",")[0]+"."}</b> ${t.expl}</div>`;
    } else {
      h+=`<textarea id="fgTa${i}" placeholder="${l.writeHere}">${st.text??""}</textarea><div><button class="btn ghost" data-sample="${i}">${l.sample}</button></div>`;
      if(st.sample) h+=`<div class="fb info"><b>${l.sampleLbl}</b> ${t.sample}</div>`;
    }
    h+=`</div>`;
  });
  box.innerHTML=h+"</div>";
  f.tasks.forEach((t,i)=>{
    const inp=$("fgIn"+i); if(inp) inp.oninput=()=>{fgState[i].val=inp.value;};
    const ta=$("fgTa"+i); if(ta) ta.oninput=()=>{fgState[i].text=ta.value;};
  });
  box.querySelectorAll("[data-check]").forEach(b=>b.onclick=()=>{const i=+b.dataset.check, t=FG[lang].tasks[i], v=parseFloat(String($("fgIn"+i).value).replace(",","."));
    fgState[i].val=$("fgIn"+i).value; fgState[i].res = (!isNaN(v) && Math.abs(v-t.ans)<=Math.max(t.tol??0.02*Math.abs(t.ans),1e-9))?"good":"bad"; renderFG();});
  box.querySelectorAll("[data-sol]").forEach(b=>b.onclick=()=>{fgState[+b.dataset.sol].sol=true; renderFG();});
  box.querySelectorAll("[data-task]").forEach(b=>b.onclick=()=>{fgState[+b.dataset.task].pick=+b.dataset.j; renderFG();});
  box.querySelectorAll("[data-sample]").forEach(b=>b.onclick=()=>{fgState[+b.dataset.sample].sample=!fgState[+b.dataset.sample].sample; renderFG();});
}
const _applyLang0=applyLang;
applyLang=function(){_applyLang0(); renderProb(); renderFG(); renderQuizExtra();};
const _renderQuiz0=renderQuiz;
function renderQuizExtra(){
  if(qi>=Q.length && !$("qBack")){
    const d=document.createElement("div"); d.innerHTML=`<button class="btn ghost" id="qBack">${L().backToProb}</button>`;
    $("quizBox").appendChild(d);
    $("qBack").onclick=()=>{probOpen=true; renderProb(); showStep(screens.indexOf($("p-prob")));};
  }
}
renderQuiz=function(){_renderQuiz0(); renderQuizExtra();};

/* ---------- init ---------- */
const savedTheme=store.get("theme"); if(savedTheme) document.documentElement.dataset.theme=savedTheme;
const savedLang=store.get("lang"); if(savedLang==="kz"||savedLang==="ru") lang=savedLang;
paintThemeBtn(); readColors();
applyLang();
showStep(0);
requestAnimationFrame(loop);
</script>
